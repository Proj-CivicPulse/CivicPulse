# Test overrides, layered ON TOP of src/main/resources/application.yaml.
#
# Deliberately a PROFILE file (application-test.yaml), not application.yaml:
# a test-classpath file with the same name as the main one replaces it
# outright instead of merging, which would silently drop the Flyway and
# ddl-auto=validate settings and make the context test pass without ever
# touching the schema.
#
# The context test is a real integration test — it applies the migrations
# and validates every JPA entity against the result. It therefore needs a
# reachable database, and by default uses whatever your .env points at.
#
# ⚠️ That means `./mvnw test` runs migrations against whatever DB_URL is.
# Keep .env pointed at the local Docker database, never production.
#
# TEST_DB_* below aims the tests at a different database from the app
# without touching .env — a throwaway container is best, so test rows never
# mix with dev data (docs/railway-database.md §7). CI should always use one.

spring:
  datasource:
    url: ${TEST_DB_URL:${DB_URL}}
    username: ${TEST_DB_USERNAME:${DB_USERNAME}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD}}
  # Flyway has its OWN connection (DB_MIGRATION_* in application.yaml), so
  # redirecting only the datasource above would run the tests against the
  # test database while MIGRATING whatever DB_URL points at — production.
  # TEST_DB_* must move both, or it is not a test database at all.
  flyway:
    url: ${TEST_DB_URL:${DB_MIGRATION_URL:${DB_URL}}}
    user: ${TEST_DB_USERNAME:${DB_MIGRATION_USERNAME:${DB_USERNAME}}}
    password: ${TEST_DB_PASSWORD:${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}}

app:
  frontend-origin: http://localhost:5173
  cookie-secure: false
  health-timeout-seconds: 10
  # A fixed value so /internal/* is reachable in slice tests without a real secret.
  internal-token: test-internal-token
  matching:
    # The context test must not fire the scheduled sweep at a real backend-node.
    reconciliation:
      enabled: false
  priority:
    # Likewise: the context test must not start rewriting priority scores in
    # whatever database it was pointed at.
    refresh:
      enabled: false

jwt:
  secret: test-only-secret-value-not-used-anywhere-real-0123456789
  access-expiration: 900000
  refresh-expiration: 604800000
