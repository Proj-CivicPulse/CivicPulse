spring:
  application:
    name: backend-spring

  # Spring Boot does not read .env files on its own. This built-in import
  # loads backend-spring/.env as a property source when present (local dev);
  # in production the platform injects real env vars and the file is absent,
  # which `optional:` tolerates. See .env.example.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # JDBC URL — note the jdbc: prefix and that credentials are separate
    # properties. This is NOT the same format as backend-node's
    # DATABASE_URL (postgres://user:pass@host/db).
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      # Generous enough to absorb a Neon cold start (the compute suspends
      # when idle and takes a second or two to wake), but far below the
      # 30s default, which would pin a request thread when the database is
      # genuinely unreachable.
      connection-timeout: 15000
      # Let the pool drain to nothing when idle so Neon's compute can
      # actually suspend — holding connections open keeps it awake and
      # burns free-tier compute hours for no benefit.
      minimum-idle: 0
      idle-timeout: 30000

  jpa:
    hibernate:
      # `validate`, never `update`: Flyway owns the schema. Hibernate only
      # checks the entities still match what the migrations produced, and
      # fails fast at startup if they have drifted.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway takes a SESSION-level advisory lock for the duration of a
    # migration run. PgBouncer in transaction-pooling mode (Neon's `-pooler`
    # host) does not keep one client on one server session, so that lock
    # cannot be relied on there. Point DB_MIGRATION_URL at Neon's DIRECT
    # host (the one WITHOUT `-pooler`) while `spring.datasource.url` above
    # uses the pooler for normal traffic.
    #
    # Falls back to DB_URL when unset, which is correct for local dev and for
    # any deployment that is not going through a pooler.
    url: ${DB_MIGRATION_URL:${DB_URL}}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
    # Deliberately off: an unversioned database should fail loudly rather
    # than have Flyway assume its current state is V1.
    baseline-on-migrate: false

server:
  # PaaS platforms (Railway, Render, Heroku) assign a port dynamically and
  # inject it as PORT. SERVER_PORT stays supported for local use and takes
  # second place; binding the wrong one makes the platform's health check
  # fail with no obvious cause.
  port: ${PORT:${SERVER_PORT:8080}}
  # Whether to trust X-Forwarded-For / X-Forwarded-Proto for the client's
  # address. Affects the per-IP login budget (app.auth.max-attempts-per-ip).
  #
  # "none" (default) is the SAFE value: without a proxy in front, trusting
  # these headers would let any caller spoof a fresh IP per request and walk
  # straight around the limit.
  #
  # Set to "framework" ONLY when this service sits behind a reverse proxy you
  # control that overwrites the header (nginx, a cloud load balancer). Leaving
  # it "none" there is not a security hole — it just collapses every user into
  # the proxy's single address, so the per-IP budget throttles everyone at
  # once. The per-email budget is unaffected either way.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    # Never leak stack traces or internal messages to clients — errors are
    # rendered by GlobalExceptionHandler in the shared contract shape.
    include-stacktrace: never
    include-message: never

app:
  # Allowed browser origins for CORS, comma-separated. Each entry may contain
  # a "*" wildcard so one value covers Vercel's per-deploy preview URLs
  # (https://myapp-*.vercel.app). A BARE "*" is rejected at startup —
  # credentials are allowed, and "*" with credentials is invalid and unsafe.
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  # Marks auth cookies Secure. Must be true anywhere served over HTTPS.
  cookie-secure: ${COOKIE_SECURE:false}
  # Ceiling on the /health database probe. Sized for a Neon cold start
  # rather than a local socket — too tight and an idle database reports
  # itself down on the first request after a quiet period.
  health-timeout-seconds: ${HEALTH_TIMEOUT_SECONDS:10}

  # Ward derivation. "centroid" picks the nearest seeded ward centroid; a
  # future "postgis" would do real point-in-polygon. Swapping this is the only
  # change needed — nothing outside WardResolver names an implementation.
  ward-resolver: ${WARD_RESOLVER:centroid}
  # Beyond this radius a point resolves to no ward at all, and the caller gets
  # a 404 instead of a silent mis-filing into whichever ward happened to be
  # least far away.
  ward-resolution-max-km: ${WARD_RESOLUTION_MAX_KM:25}

  # Shared secret for /internal/* (Node -> Spring). Blank denies everything:
  # an unset secret must break the integration, not open it.
  internal-token: ${INTERNAL_TOKEN:}

  # Reverse geocoding. "none" leaves addresses null and needs no key, which is
  # the default so a fresh clone runs without a billing account.
  geocoding:
    provider: ${GEOCODING_PROVIDER:none}
    # Server-side only. Never reaches the browser, so unlike a Maps JS key this
    # can stay secret and be restricted by IP rather than HTTP referrer.
    api-key: ${GOOGLE_GEOCODING_API_KEY:}
    # Decimal places the cache key rounds to. 3 is ~111 m; measured against real
    # data, 4 (~11 m) only achieved a 3% hit rate because reports about one
    # pothole are not placed within 11 m of each other.
    cache-key-scale: ${GEOCODING_CACHE_KEY_SCALE:3}

  # Bounds on outbound third-party calls. An untimed client hangs a request
  # thread when the provider is slow, which is how one dependency takes down
  # the whole service.
  http-connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:3000}
  http-read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:5000}

  # Phase 2 semantic matching. The trigger to backend-node is async and fired
  # after the complaint commits, so a slow or dead Node never delays the
  # citizen's response.
  matching:
    node-base-url: ${NODE_BASE_URL:http://localhost:3001}
    process-timeout-ms: ${MATCHING_PROCESS_TIMEOUT_MS:2500}
    # Must match backend-node's PROCESSING_STALE_SECONDS. Node's compare-and-swap
    # claim is the authority; this only pre-filters reconcile candidates.
    processing-stale-seconds: ${MATCHING_PROCESSING_STALE_SECONDS:45}
    circuit-breaker:
      failure-threshold: ${MATCHING_CB_FAILURES:3}
      open-seconds: ${MATCHING_CB_OPEN_SECONDS:60}
    reconciliation:
      enabled: ${MATCHING_RECONCILE_ENABLED:true}
      interval-ms: ${MATCHING_RECONCILE_INTERVAL_MS:60000}
      batch-size: ${MATCHING_RECONCILE_BATCH:25}

  # The NAIVE FALLBACK matcher (ward + category + window + radius). Runs only
  # when backend-node is unreachable; tags the complaint "degraded" so the
  # reconcile sweep upgrades it later. "none" disables the fallback entirely.
  incident-grouping:
    strategy: ${INCIDENT_GROUPING_STRATEGY:naive}
    window-days: ${INCIDENT_GROUPING_WINDOW_DAYS:14}
    max-distance-km: ${INCIDENT_GROUPING_MAX_KM:1.5}

  # Login brute-force budgets. Two independent counters: a tight per-account
  # one that stops password guessing, and a loose per-IP one that catches
  # spraying across many accounts without locking out a shared office NAT.
  auth:
    max-attempts-per-email: ${AUTH_MAX_ATTEMPTS_PER_EMAIL:5}
    max-attempts-per-ip: ${AUTH_MAX_ATTEMPTS_PER_IP:50}
    attempt-window-seconds: ${AUTH_ATTEMPT_WINDOW_SECONDS:900}
    lockout-seconds: ${AUTH_LOCKOUT_SECONDS:900}
    max-tracked-keys: ${AUTH_MAX_TRACKED_KEYS:100000}
    # Grace for a genuine two-tab refresh race before a replayed refresh token
    # is treated as theft and the session is killed.
    refresh-reuse-grace-seconds: ${AUTH_REFRESH_REUSE_GRACE_SECONDS:30}
    # Budgets for the endpoints that SEND mail (verification resend, password
    # reset). Every request counts, not just failures: the send is the abuse.
    email-requests-per-address: ${AUTH_EMAIL_REQUESTS_PER_ADDRESS:3}
    email-requests-per-ip: ${AUTH_EMAIL_REQUESTS_PER_IP:10}
    email-request-window-seconds: ${AUTH_EMAIL_REQUEST_WINDOW_SECONDS:3600}

  # Transactional email, used only by verification and password reset.
  # "log" (default) prints the message — including the link — to the console
  # instead of delivering it, so both flows work end to end on a fresh clone
  # with no account and no key. "resend" turns on real delivery.
  email:
    provider: ${EMAIL_PROVIDER:log}
    # Server-side only, never reaches the browser.
    api-key: ${RESEND_API_KEY:}
    # Must be on a domain verified with Resend. Their onboarding@resend.dev
    # sender works for testing without verifying anything.
    from-address: ${EMAIL_FROM_ADDRESS:CivicPulse <onboarding@resend.dev>}
    # Where emailed links point — the FRONTEND, since a human clicks them.
    link-base-url: ${EMAIL_LINK_BASE_URL:http://localhost:5173}
    # Long: expiry only costs a confused user another request, and the token
    # grants nothing beyond "this address is real".
    verification-ttl-hours: ${EMAIL_VERIFICATION_TTL_HOURS:24}
    # Short: this token IS the account until used.
    reset-ttl-minutes: ${EMAIL_RESET_TTL_MINUTES:60}

jwt:
  secret: ${JWT_SECRET}
  # Short-lived access token; the refresh token below buys back the UX.
  #
  # 15 minutes is also the ceiling on how long a role change made directly in
  # SQL takes to reach a signed-in user: authorization reads the role from the
  # token, and only a refresh re-reads it from the database. Revoking a whole
  # session is immediate (SessionRevocationRegistry); changing what a session
  # is allowed to do is not.
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}      # 15 minutes
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days

logging:
  level:
    com.civicpulse: ${LOG_LEVEL:INFO}
