<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline';" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="description"
        content="CivicPulse groups related citizen complaints into prioritized, explainable incidents for city officers — using semantic matching, not keyword or category filters." />
    <!-- Light theme only (design brief §3), so a single unconditional value. -->
    <meta name="theme-color" content="#E7EBE6" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_APP_NAME%" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="%VITE_APP_NAME% — Civic complaint management" />
    <meta property="og:description"
        content="Related citizen complaints, grouped into prioritized and explainable incidents for city officers." />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%VITE_APP_NAME% — Civic complaint management" />
    <meta name="twitter:description"
        content="Related citizen complaints, grouped into prioritized and explainable incidents for city officers." />

    <style>
        /*
         * Hide the page-level scrollbar only; scrolling still works.
         *
         * Deliberately NOT applied to `*`. The officer console's incident queue
         * is a full-bleed table inside its own overflow-x container, and a
         * horizontally scrollable region with no scrollbar has zero affordance
         * that it scrolls at all.
         */
        html,
        body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            width: 0;
            height: 0;
            display: none;
        }
    </style>

    <title>%VITE_APP_NAME% — Civic complaint management</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
