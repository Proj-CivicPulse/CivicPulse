# Local PostgreSQL + pgvector for CivicPulse development.
#
# The credentials below default to the throwaway LOCAL-ONLY values used
# across the repo (they match backend-node/.env). They are not secrets and
# must never be reused for anything deployed. To override, copy
# ./.env.example to ./.env (gitignored) and change the values there.
#
# Quick start, from the repo root:
#   docker compose up -d postgres
#
# Full command list: README.md -> "Database (local, via Docker)".

name: civicpulse

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: civicpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicpulse}
      POSTGRES_USER: ${POSTGRES_USER:-civicpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicpulse}
    ports:
      # Bound to localhost only — not reachable from the LAN. Matches
      # DATABASE_URL=postgres://civicpulse:civicpulse@localhost:5432/civicpulse
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - civicpulse-pgdata:/var/lib/postgresql/data
      # *.sql / *.sh here run ONCE, only on first cluster init (empty
      # volume), against POSTGRES_DB as POSTGRES_USER.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ escapes the compose variable so the container's shell expands
      # its own POSTGRES_* env at runtime.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  civicpulse-pgdata:
    name: civicpulse-pgdata
